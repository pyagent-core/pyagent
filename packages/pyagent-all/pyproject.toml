[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyagent-all"
version = "0.2.4"
description = "Meta-package: installs all PyAgent packages (patterns, router, compress, trace, providers, context, blueprint, studio)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "PyAgent Team", email = "team@pyagent.org"}]
keywords = ["agents", "multi-agent", "LLM", "patterns", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pyagent-patterns>=0.2.4",
    "pyagent-router>=0.2.4",
    "pyagent-compress>=0.2.4",
    "pyagent-trace>=0.2.4",
    "pyagent-providers>=0.2.4",
    "pyagent-context>=0.2.4",
    "pyagent-blueprint>=0.2.4",
    "pyagent-studio>=0.2.4",
    "litellm>=1.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://pyagent.org"
Repository = "https://github.com/pyagent-core/pyagent"
Documentation = "https://pyagent.org"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyagent_all"]
