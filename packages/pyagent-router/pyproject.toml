[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyagent-router"
version = "0.2.4"
description = "Difficulty-aware routing and model selection for multi-agent LLM workflows"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "PyAgent Team", email = "team@pyagent.org"}]
keywords = ["agents", "routing", "LLM", "cost-optimization", "model-selection", "deterministic process orchestration", "token-efficient agents", "cost-aware routing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["pyagent-patterns>=0.1.0"]

[project.urls]
Homepage = "https://pyagent.org"
Repository = "https://github.com/pyagent-core/pyagent"
Documentation = "https://pyagent.org"
"Agent Orchestration Patterns" = "https://pyagent.org/patterns/orchestrator-worker/"
"Agent Harness Architecture" = "https://pyagent.org/architecture/multi-agent-harness/"
"Agent Experience Optimization" = "https://pyagent.org/concepts/agent-experience-optimization/"

[project.optional-dependencies]
tiktoken = ["tiktoken>=0.7"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyagent_router"]
