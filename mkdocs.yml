site_name: PyAgent
site_description: "18 reusable multi-agent orchestration patterns for LLMs — with routing, compression, and OTel tracing"
site_url: https://pyagent.org
repo_url: https://github.com/pyagent-core/pyagent
repo_name: pyagent-core/pyagent

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.mark
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - packages/pyagent-patterns/src
            - packages/pyagent-router/src
            - packages/pyagent-compress/src
            - packages/pyagent-trace/src
            - packages/pyagent-providers/src
            - packages/pyagent-context/src
            - packages/pyagent-blueprint/src
            - packages/pyagent-studio/src
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Guides:
    - Composition: guides/composition.md
    - Routing: guides/router.md
    - Compression: guides/compression.md
    - Tracing: guides/tracing.md
    - Guardrails: guides/guardrails.md
    - Recovery: guides/recovery.md
    - Providers: guides/providers.md
    - Context: guides/context.md
    - Hooks: guides/hooks.md
    - Blueprint: guides/blueprint.md
    - Studio: guides/studio.md
  - Packages:
    - Patterns:
      - Overview: packages/patterns/index.md
      - Orchestration:
        - Supervisor: packages/patterns/orchestration/supervisor.md
        - Pipeline: packages/patterns/orchestration/pipeline.md
        - Fan-Out / Fan-In: packages/patterns/orchestration/fan-out-fan-in.md
        - Hierarchical: packages/patterns/orchestration/hierarchical.md
        - Orchestrator-Workers: packages/patterns/orchestration/orchestrator-workers.md
      - Resolution:
        - Self-Reflection: packages/patterns/resolution/self-reflection.md
        - Cross-Reflection: packages/patterns/resolution/cross-reflection.md
        - Debate: packages/patterns/resolution/debate.md
        - Voting: packages/patterns/resolution/voting.md
        - Evaluator-Optimizer: packages/patterns/resolution/evaluator-optimizer.md
      - Structural:
        - Role-Based: packages/patterns/structural/role-based.md
        - Layered: packages/patterns/structural/layered.md
        - Topology: packages/patterns/structural/topology.md
        - Blackboard: packages/patterns/structural/blackboard.md
      - Advanced:
        - Talker-Reasoner: packages/patterns/advanced/talker-reasoner.md
        - Swarm: packages/patterns/advanced/swarm.md
        - Human-in-the-Loop: packages/patterns/advanced/human-in-the-loop.md
        - ReAct: packages/patterns/advanced/react.md
    - Router: packages/router.md
    - Compress: packages/compress.md
    - Trace: packages/trace.md
    - Context: packages/context.md
    - Providers: packages/providers.md
    - Blueprint: packages/blueprint.md
    - Studio: packages/studio.md
  - Cookbook:
    - Code Review Agent: cookbook/code-review.md
    - Research Agent: cookbook/research.md
    - Customer Support: cookbook/customer-support.md
    - API & Hooks Bibliography: cookbook/api-bibliography.md
  - API Reference:
    - pyagent-patterns: api/patterns.md
    - pyagent-router: api/router.md
    - pyagent-compress: api/compress.md
    - pyagent-trace: api/trace.md
    - pyagent-providers: api/providers.md
    - pyagent-context: api/context.md
    - pyagent-blueprint: api/blueprint.md
    - pyagent-studio: api/studio.md
  - Benchmarks: benchmarks.md
  - Contributing: contributing.md
