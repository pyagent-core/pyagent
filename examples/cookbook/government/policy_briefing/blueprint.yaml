api_version: pyagent/v1
metadata:
  name: policy-briefing
  version: 1.0.0
  description: Director delegates economics + legal teams; synthesizes ministerial brief

providers:
  fast:  { model: gpt-4o-mini }
  smart: { model: claude-sonnet-4-20250514 }

agents:
  policy_director: { provider: smart, prompt: "Decompose, delegate teams, synthesize 1-page brief." }
  economics_lead:  { provider: fast,  prompt: "Coordinate fiscal and labor analyses." }
  fiscal_analyst:  { provider: fast,  prompt: "Estimate budget impact and costs over 5 years." }
  labour_analyst:  { provider: fast,  prompt: "Assess employment and wage effects." }
  legal_lead:      { provider: fast,  prompt: "Coordinate statutory and rights analyses." }
  statute_analyst: { provider: fast,  prompt: "Identify required legislation and precedent." }
  rights_analyst:  { provider: fast,  prompt: "Assess civil-rights and privacy impacts." }

workflows:
  brief:
    pattern: hierarchical
    agents:
      manager: policy_director
      teams:
        - { name: Economics, lead: economics_lead, workers: [fiscal_analyst, labour_analyst] }
        - { name: Legal,     lead: legal_lead,     workers: [statute_analyst, rights_analyst] }

observability:
  tracing: { enabled: true }
  cost_budget: { daily_usd: 100.0, alert_threshold: 0.8 }
