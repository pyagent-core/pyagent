api_version: pyagent/v1
metadata:
  name: lead-qualifier
  version: 1.0.0
  description: Supervisor routes leads to AE, nurture, or cold-hold based on score

providers:
  fast:  { model: gpt-4o-mini }
  smart: { model: claude-sonnet-4-20250514 }

agents:
  scorer:      { provider: fast,  prompt: "Score as hot/warm/cold. Reply with only the label." }
  account_exec:{ provider: smart, prompt: "Draft 4-sentence personalized outreach. End with CTA." }
  nurture:     { provider: fast,  prompt: "Add to 3-touch nurture sequence. Draft touch 1." }
  cold_hold:   { provider: fast,  prompt: "Brief polite holding reply. Tag for 90-day re-check." }

workflows:
  qualify:
    pattern: supervisor
    classifier: scorer
    routes: { hot: account_exec, warm: nurture, cold: cold_hold }
    default_route: warm

observability:
  tracing: { enabled: true }
  cost_budget: { daily_usd: 50.0, alert_threshold: 0.8 }
