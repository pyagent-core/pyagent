api_version: pyagent/v1
metadata:
  name: trip-planner
  version: 1.0.0
  description: Swarm of flight/lodging/activities/budget/guide agents converge on itinerary

providers:
  gemini: { model: gemini-2.5-flash }

agents:
  flights:    { provider: gemini, prompt: "Plan flights within budget. Adjust when neighbors change." }
  lodging:    { provider: gemini, prompt: "Plan lodging near activities and airport. Update when flights change." }
  activities: { provider: gemini, prompt: "Plan daily activities. Keep within remaining budget." }
  budget:     { provider: gemini, prompt: "Track total budget. Flag overruns. Push neighbors to trade off." }
  local_guide:{ provider: gemini, prompt: "Add authentic local food and neighbourhood picks; avoid tourist traps." }

workflows:
  plan:
    pattern: swarm
    agents: [flights, lodging, activities, budget, local_guide]
    rounds: 3

observability:
  tracing: { enabled: true }
  cost_budget: { daily_usd: 50.0, alert_threshold: 0.8 }
