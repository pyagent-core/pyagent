name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  PYTHONPATH: "${{ github.workspace }}/packages/pyagent-patterns/src:${{ github.workspace }}/packages/pyagent-compress/src:${{ github.workspace }}/packages/pyagent-router/src:${{ github.workspace }}/packages/pyagent-trace/src:${{ github.workspace }}/packages/pyagent-context/src:${{ github.workspace }}/packages/pyagent-providers/src:${{ github.workspace }}/packages/pyagent-blueprint/src:${{ github.workspace }}/packages/pyagent-studio/src"

jobs:

  # ── Stage 1: Lint ────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check packages/
      - run: ruff format --check packages/

  # ── Stage 2: Test ────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          pip install pytest pytest-asyncio
          pip install -e packages/pyagent-patterns
          pip install -e packages/pyagent-router
          pip install -e packages/pyagent-compress
          pip install -e packages/pyagent-trace
          pip install -e packages/pyagent-context
          pip install -e packages/pyagent-providers
          pip install -e "packages/pyagent-blueprint[dev]"
          pip install -e "packages/pyagent-studio[dev]"
      - run: python -m pytest packages/ -v --tb=short

  # ── Stage 3a: Benchmark ──────────────────────────────────────────────────────
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-asyncio
      - run: python -m benchmarks.run --suite cost

  # ── Stage 3b: Docs check (every push + PR) ──────────────────────────────────
  docs-check:
    name: Docs — Build Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install mkdocs mkdocs-material mkdocstrings[python]
          pip install -e packages/pyagent-patterns
          pip install -e packages/pyagent-router
          pip install -e packages/pyagent-compress
          pip install -e packages/pyagent-trace
          pip install -e packages/pyagent-context
          pip install -e packages/pyagent-providers
          pip install -e "packages/pyagent-blueprint[dev]"
          pip install -e "packages/pyagent-studio[dev]"
      - run: mkdocs build --strict

  # ── Stage 4a: Docs deploy (main branch only) ─────────────────────────────────
  docs-deploy:
    name: Docs — Deploy
    runs-on: ubuntu-latest
    needs: docs-check
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install mkdocs mkdocs-material mkdocstrings[python]
          pip install -e packages/pyagent-patterns
          pip install -e packages/pyagent-router
          pip install -e packages/pyagent-compress
          pip install -e packages/pyagent-trace
          pip install -e packages/pyagent-context
          pip install -e packages/pyagent-providers
          pip install -e "packages/pyagent-blueprint[dev]"
          pip install -e "packages/pyagent-studio[dev]"
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - uses: actions/deploy-pages@v4
        id: deployment

  # ── Stage 4b: Publish to PyPI (v* tags only) ─────────────────────────────────
  publish:
    name: Publish — PyPI
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Build all packages
      - run: uv build --package pyagent-patterns  --out-dir dist/pyagent-patterns
      - run: uv build --package pyagent-compress   --out-dir dist/pyagent-compress
      - run: uv build --package pyagent-router     --out-dir dist/pyagent-router
      - run: uv build --package pyagent-trace      --out-dir dist/pyagent-trace
      - run: uv build --package pyagent-context    --out-dir dist/pyagent-context
      - run: uv build --package pyagent-providers  --out-dir dist/pyagent-providers
      - run: uv build --package pyagent-blueprint  --out-dir dist/pyagent-blueprint
      - run: uv build --package pyagent-studio     --out-dir dist/pyagent-studio
      - run: uv build --package pyagent-all        --out-dir dist/pyagent-all

      # Publish in dependency order
      - name: Publish pyagent-patterns
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pyagent-patterns/
          skip-existing: true

      - name: Publish pyagent-compress
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pyagent-compress/
          skip-existing: true

      - name: Publish pyagent-router
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pyagent-router/
          skip-existing: true

      - name: Publish pyagent-trace
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pyagent-trace/
          skip-existing: true

      - name: Publish pyagent-context
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pyagent-context/
          skip-existing: true

      - name: Publish pyagent-providers
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pyagent-providers/
          skip-existing: true

      - name: Publish pyagent-blueprint
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pyagent-blueprint/
          skip-existing: true

      - name: Publish pyagent-studio
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pyagent-studio/
          skip-existing: true

      - name: Publish pyagent-all
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pyagent-all/
          skip-existing: true
