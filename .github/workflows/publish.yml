name: Publish to PyPI

on:
  push:
    tags:
      - "v*"          # e.g. v0.2.1
  workflow_dispatch:  # allow manual trigger

jobs:
  # ── Step 1: build all packages ──────────────────────────────────────────────
  build:
    name: Build packages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build pyagent-patterns
        run: uv build --package pyagent-patterns --out-dir dist/pyagent-patterns

      - name: Build pyagent-compress
        run: uv build --package pyagent-compress --out-dir dist/pyagent-compress

      - name: Build pyagent-router
        run: uv build --package pyagent-router --out-dir dist/pyagent-router

      - name: Build pyagent-trace
        run: uv build --package pyagent-trace --out-dir dist/pyagent-trace

      - name: Build pyagent-context
        run: uv build --package pyagent-context --out-dir dist/pyagent-context

      - name: Build pyagent-providers
        run: uv build --package pyagent-providers --out-dir dist/pyagent-providers

      - name: Build pyagent-blueprint
        run: uv build --package pyagent-blueprint --out-dir dist/pyagent-blueprint

      - name: Build pyagent-blueprint-adapter-langgraph
        run: uv build --package pyagent-blueprint-adapter-langgraph --out-dir dist/pyagent-blueprint-adapter-langgraph

      - name: Build pyagent-blueprint-adapter-crewai
        run: uv build --package pyagent-blueprint-adapter-crewai --out-dir dist/pyagent-blueprint-adapter-crewai

      - name: Build pyagent-blueprint-adapter-openai-agents
        run: uv build --package pyagent-blueprint-adapter-openai-agents --out-dir dist/pyagent-blueprint-adapter-openai-agents

      - name: Build pyagent-blueprint-adapter-semantic-kernel
        run: uv build --package pyagent-blueprint-adapter-semantic-kernel --out-dir dist/pyagent-blueprint-adapter-semantic-kernel

      - name: Build pyagent-studio
        run: uv build --package pyagent-studio --out-dir dist/pyagent-studio

      - name: Build pyagent-all
        run: uv build --package pyagent-all --out-dir dist/pyagent-all

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ── Step 2: publish in dependency order ─────────────────────────────────────
  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # matches the Trusted Publisher environment name on PyPI

    permissions:
      id-token: write          # required for OIDC Trusted Publishers

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Tier 1 — no inter-package deps
      - name: Publish pyagent-patterns
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pyagent-patterns/
          skip-existing: true

      - name: Publish pyagent-compress
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pyagent-compress/
          skip-existing: true

      - name: Publish pyagent-router
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pyagent-router/
          skip-existing: true

      - name: Publish pyagent-trace
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pyagent-trace/
          skip-existing: true

      - name: Publish pyagent-context
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pyagent-context/
          skip-existing: true

      # Tier 2 — depends on patterns + router
      - name: Publish pyagent-providers
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pyagent-providers/
          skip-existing: true

      # Tier 3 — depends on providers + context
      - name: Publish pyagent-blueprint
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pyagent-blueprint/
          skip-existing: true

      # Tier 3.5 — depends on pyagent-blueprint + the third-party runtime they target
      - name: Publish pyagent-blueprint-adapter-langgraph
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pyagent-blueprint-adapter-langgraph/
          skip-existing: true

      - name: Publish pyagent-blueprint-adapter-crewai
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pyagent-blueprint-adapter-crewai/
          skip-existing: true

      - name: Publish pyagent-blueprint-adapter-openai-agents
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pyagent-blueprint-adapter-openai-agents/
          skip-existing: true

      - name: Publish pyagent-blueprint-adapter-semantic-kernel
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pyagent-blueprint-adapter-semantic-kernel/
          skip-existing: true

      # Tier 4 — depends on blueprint + trace
      - name: Publish pyagent-studio
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pyagent-studio/
          skip-existing: true

      # Meta-package last — depends on everything
      - name: Publish pyagent-all
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/pyagent-all/
          skip-existing: true
