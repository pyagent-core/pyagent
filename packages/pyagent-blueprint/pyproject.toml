[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyagent-blueprint"
version = "0.2.4"
description = "Declarative YAML specs for multi-agent LLM systems — validate, compile, test, diff, render"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "PyAgent Team", email = "team@pyagent.org"}]
keywords = ["agents", "blueprint", "YAML", "LLM", "declarative", "schema", "deterministic process orchestration", "declarative multi-agent", "stateful multi-actor workflows", "agent-experience-optimization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.urls]
Homepage = "https://pyagent.org"
Repository = "https://github.com/pyagent-core/pyagent"
Documentation = "https://pyagent.org"
"Design Patterns" = "https://pyagent.org/packages/patterns/"
"Getting Started" = "https://pyagent.org/getting-started/"
"Cookbook" = "https://pyagent.org/cookbook/"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]
pyagent = [
    "pyagent-patterns>=0.1.0",
    "pyagent-router>=0.1.0",
    "pyagent-providers>=0.1.0",
    "pyagent-context>=0.1.0",
]

[project.entry-points."pyagent_blueprint.adapters"]
pyagent = "pyagent_blueprint.adapters.pyagent_adapter:PyAgentAdapter"
simple_loop = "pyagent_blueprint.adapters.reference.simple_loop:SimpleLoopAdapter"
state_machine = "pyagent_blueprint.adapters.reference.state_machine:StateMachineAdapter"
sequential_chain = "pyagent_blueprint.adapters.reference.sequential_chain:SequentialChainAdapter"
single_agent = "pyagent_blueprint.adapters.reference.single_agent:SingleAgentAdapter"

[project.scripts]
pyagent-blueprint = "pyagent_blueprint.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/pyagent_blueprint"]
