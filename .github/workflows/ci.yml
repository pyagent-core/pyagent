name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
    PYTHONPATH: "${{ github.workspace }}/packages/pyagent-patterns/src:${{ github.workspace }}/packages/pyagent-compress/src:${{ github.workspace }}/packages/pyagent-router/src:${{ github.workspace }}/packages/pyagent-trace/src:${{ github.workspace }}/packages/pyagent-context/src:${{ github.workspace }}/packages/pyagent-providers/src:${{ github.workspace }}/packages/pyagent-blueprint/src:${{ github.workspace }}/packages/pyagent-studio/src"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check packages/
      - run: ruff format --check packages/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          pip install pytest pytest-asyncio
          pip install -e packages/pyagent-patterns
          pip install -e packages/pyagent-router
          pip install -e packages/pyagent-compress
          pip install -e packages/pyagent-trace
          pip install -e packages/pyagent-context
          pip install -e packages/pyagent-providers
          pip install -e "packages/pyagent-blueprint[dev]"
          pip install -e "packages/pyagent-studio[dev]"
      - run: python -m pytest packages/ -v --tb=short

  benchmark:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-asyncio
      - run: python -m benchmarks.run --suite cost

  docs:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install mkdocs mkdocs-material mkdocstrings[python]
          pip install -e packages/pyagent-patterns
          pip install -e packages/pyagent-router
          pip install -e packages/pyagent-compress
          pip install -e packages/pyagent-trace
          pip install -e packages/pyagent-context
          pip install -e packages/pyagent-providers
          pip install -e "packages/pyagent-blueprint[dev]"
          pip install -e "packages/pyagent-studio[dev]"

      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - uses: actions/deploy-pages@v4
        id: deployment
