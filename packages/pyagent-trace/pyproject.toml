[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyagent-trace"
version = "0.2.4"
description = "Pattern-aware OpenTelemetry tracing for multi-agent LLM systems"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "PyAgent Team", email = "team@pyagent.org"}]
keywords = ["agents", "tracing", "OpenTelemetry", "observability", "LLM"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pyagent-patterns>=0.1.0",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]

[project.urls]
Homepage = "https://pyagent.org"
Repository = "https://github.com/pyagent-core/pyagent"
Documentation = "https://pyagent.org"

[project.optional-dependencies]
langfuse = ["langfuse>=2.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyagent_trace"]
