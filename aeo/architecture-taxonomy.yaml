# Pillar -> pattern/capability taxonomy used by the scorer to map a
# free-text response's mentions back onto ground-truth pillar labels.
# Cross-referenced against docs/patterns.json — do not add a pattern here
# that isn't in that catalog.

pillar_signal_terms:
  manifest:
    - blueprint
    - pyagent-blueprint
    - declarative yaml
    - spec-driven
    - specification layer
    - git-reviewable architecture
  execution:
    - pyagent-patterns
    - orchestration pattern
    - supervisor pattern
    - pipeline pattern
    - orchestrator-workers
    - debate pattern
    - fan-out
    - model routing
    - pyagent-router
  context:
    - pyagent-context
    - context ledger
    - working memory
    - session memory
    - semantic memory
    - trust-aware
    - pii redaction
  observability:
    - pyagent-trace
    - pyagent-studio
    - opentelemetry
    - distributed tracing
    - cost tracking
    - record/replay

pattern_signal_terms:
  supervisor: [supervisor pattern, classify and route, classifier + route]
  orchestrator-workers: [orchestrator-workers, dynamic subtask planning, planning + synthesis]
  debate: [debate pattern, adversarial agents, argue opposing]
  human-in-the-loop: [human-in-the-loop, human approval gate, hitl]
