site_name: PyAgent
site_description: "PyAgent: a production stack for multi-agent LLM systems — YAML blueprints, 18 orchestration patterns, three-tier memory, and OTel tracing"
site_url: https://pyagent.org
repo_url: https://github.com/pyagent-core/pyagent
repo_name: pyagent-core/pyagent

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/recipe-filter.css

extra_javascript:
  - javascripts/guided-mode.js
  - javascripts/mermaid-reinit.js
  - javascripts/recipe-filter.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.mark
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - redirects:
      redirect_maps:
        patterns/orchestrator-worker.md: packages/patterns/orchestration/orchestrator-workers.md
        patterns/plan-act-reflect.md: packages/patterns/advanced/react.md
        architecture/multi-agent-harness.md: guides/recovery.md
        concepts/agent-experience-optimization.md: guides/blueprint.md
        cookbook/code-review.md: cookbook/software-engineering/code-review.md
        cookbook/research.md: cookbook/research-analysis/research-assistant.md
        api/patterns.md: api/patterns/base.md
        cookbook/api-bibliography.md: api/bibliography.md
        cookbook/customer-support/index.md: cookbook/index.md
        cookbook/data-analytics/index.md: cookbook/index.md
        cookbook/devops-sre/index.md: cookbook/index.md
        cookbook/ecommerce-retail/index.md: cookbook/index.md
        cookbook/education/index.md: cookbook/index.md
        cookbook/finance-trading/index.md: cookbook/index.md
        cookbook/gaming/index.md: cookbook/index.md
        cookbook/government/index.md: cookbook/index.md
        cookbook/healthcare/index.md: cookbook/index.md
        cookbook/hr-recruiting/index.md: cookbook/index.md
        cookbook/legal-compliance/index.md: cookbook/index.md
        cookbook/marketing-content/index.md: cookbook/index.md
        cookbook/media-entertainment/index.md: cookbook/index.md
        cookbook/real-estate/index.md: cookbook/index.md
        cookbook/research-analysis/index.md: cookbook/index.md
        cookbook/sales-crm/index.md: cookbook/index.md
        cookbook/scientific/index.md: cookbook/index.md
        cookbook/security/index.md: cookbook/index.md
        cookbook/software-engineering/index.md: cookbook/index.md
        cookbook/travel-hospitality/index.md: cookbook/index.md
        cookbook/tags.md: cookbook/index.md
  - mkdocstrings:
      handlers:
        python:
          paths:
            - packages/pyagent-patterns/src
            - packages/pyagent-router/src
            - packages/pyagent-compress/src
            - packages/pyagent-trace/src
            - packages/pyagent-providers/src
            - packages/pyagent-context/src
            - packages/pyagent-blueprint/src
            - packages/pyagent-studio/src
          options:
            show_source: false
            show_root_heading: true
            heading_level: 2
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >-
        PyAgent is a production stack for multi-agent LLM systems — 18 named design patterns, a
        four-pillar framework (Blueprint, Execution & Routing, Context & Memory, Observability), and a
        Cookbook of 28 complete, runnable multi-agent orchestration examples across all 20 domains.
      sections:
        Getting Started:
          - getting-started.md
          - getting-started/*.md
        Design Patterns:
          - packages/patterns/index.md
          - packages/patterns/*/*.md
        Framework:
          - guides/*.md
          - packages/*.md
        Cookbook:
          - cookbook/index.md
          - cookbook/*/*.md
        API Reference:
          - api/*.md
          - api/patterns/*.md

nav:
  - Home: index.md
  - Getting Started:
    - Quickstart: getting-started.md
    - Core Concepts: getting-started/core-concepts.md
    - Featured Examples: getting-started/featured-examples.md

  # ── Design Patterns (flagship: full pattern library) ─────────────────────────
  - Design Patterns:
    - Overview: packages/patterns/index.md
    - Orchestration:
      - Supervisor: packages/patterns/orchestration/supervisor.md
      - Pipeline: packages/patterns/orchestration/pipeline.md
      - Fan-Out / Fan-In: packages/patterns/orchestration/fan-out-fan-in.md
      - Hierarchical: packages/patterns/orchestration/hierarchical.md
      - Orchestrator-Workers: packages/patterns/orchestration/orchestrator-workers.md
    - Resolution:
      - Self-Reflection: packages/patterns/resolution/self-reflection.md
      - Cross-Reflection: packages/patterns/resolution/cross-reflection.md
      - Debate: packages/patterns/resolution/debate.md
      - Voting: packages/patterns/resolution/voting.md
      - Evaluator-Optimizer: packages/patterns/resolution/evaluator-optimizer.md
    - Structural:
      - Role-Based: packages/patterns/structural/role-based.md
      - Layered: packages/patterns/structural/layered.md
      - Topology: packages/patterns/structural/topology.md
      - Blackboard: packages/patterns/structural/blackboard.md
    - Iterative & Advanced:
      - ReAct: packages/patterns/advanced/react.md
      - Talker-Reasoner: packages/patterns/advanced/talker-reasoner.md
      - Swarm: packages/patterns/advanced/swarm.md
      - Human-in-the-Loop: packages/patterns/advanced/human-in-the-loop.md
    - Using Patterns:
      - Composition: guides/composition.md
      - Guardrails: guides/guardrails.md
      - Recovery: guides/recovery.md

  # ── Framework (the 4 pillars) ────────────────────────────────────────────────
  - Framework:
    - Blueprint:
      - Guide: guides/blueprint.md
      - Spec Format: packages/blueprint/spec-format.md
      - Agents: packages/blueprint/agents.md
      - Workflows: packages/blueprint/workflows.md
      - Providers Config: packages/blueprint/providers.md
      - Context Config: packages/blueprint/context.md
      - Contracts & Observability: packages/blueprint/contracts.md
      - CLI: packages/blueprint/cli.md
      - Python API: packages/blueprint/compiler.md
    - Execution & Routing:
      - Hooks: guides/hooks.md
      - Providers:
        - Guide: guides/providers.md
        - Package: packages/providers.md
      - Router:
        - Guide: guides/router.md
        - Package: packages/router.md
      - Compress:
        - Guide: guides/compression.md
        - Package: packages/compress.md
    - Context & Memory:
      - Guide: guides/context.md
      - Package: packages/context.md
    - Observability:
      - Tracing:
        - Guide: guides/tracing.md
        - Package: packages/trace.md
      - Studio:
        - Guide: guides/studio.md
        - Overview: packages/studio/index.md
        - CLI: packages/studio/cli.md
        - Dashboard: packages/studio/dashboard.md
        - Services: packages/studio/services.md
        - Traces: packages/studio/traces.md

  # ── Cookbook (20 domains scaffolded; 12 with runnable recipes today) ─────────
  - Cookbook:
    - Overview: cookbook/index.md
    - Customer Onboarding Workflow: cookbook/customer-support/onboarding.md
    - Support Router: cookbook/customer-support/support-router.md
    - Analytics Task Decomposer: cookbook/data-analytics/analytics-decomposer.md
    - SQL Analyst: cookbook/data-analytics/sql-analyst.md
    - Incident Triage: cookbook/devops-sre/incident-triage.md
    - Product Launch Planner: cookbook/ecommerce-retail/product-launch-planner.md
    - Essay Grading by Consensus: cookbook/education/essay-grader.md
    - Loan Origination Workflow: cookbook/finance-trading/loan-origination.md
    - Loan Underwriting Committee: cookbook/finance-trading/loan-underwriting.md
    - Portfolio Review: cookbook/finance-trading/portfolio-review.md
    - Emergent NPC World: cookbook/gaming/npc-world.md
    - Policy Briefing Pipeline: cookbook/government/policy-briefing.md
    - CV Screener: cookbook/hr-recruiting/cv-screener.md
    - Clinical Summary: cookbook/healthcare/clinical-summary.md
    - Contract Review: cookbook/legal-compliance/contract-review.md
    - Regulatory Compliance Checker: cookbook/legal-compliance/compliance-checker.md
    - Campaign Planner: cookbook/marketing-content/campaign-planner.md
    - Writers' Room: cookbook/media-entertainment/writers-room.md
    - Property Valuation Stack: cookbook/real-estate/property-valuation.md
    - Literature Review Team: cookbook/research-analysis/literature-review.md
    - Research Assistant: cookbook/research-analysis/research-assistant.md
    - Lead Qualifier: cookbook/sales-crm/lead-qualifier.md
    - Peer-Review Mesh: cookbook/scientific/peer-review.md
    - Alert Triage: cookbook/security/log-triage.md
    - Fraud Investigation Assistant: cookbook/security/fraud-investigation.md
    - Code Review: cookbook/software-engineering/code-review.md
    - Software Startup Simulation: cookbook/software-engineering/startup-simulation.md
    - Trip-Planning Swarm: cookbook/travel-hospitality/trip-planner.md

  # ── API Reference ────────────────────────────────────────────────────────────
  - API Reference:
    - API & Hooks Bibliography: api/bibliography.md
    - pyagent-patterns:
      - Base Classes: api/patterns/base.md
      - Orchestration: api/patterns/orchestration.md
      - Resolution: api/patterns/resolution.md
      - Structural: api/patterns/structural.md
      - Advanced: api/patterns/advanced.md
      - Composition, Guardrails & Recovery: api/patterns/composition-safety.md
    - pyagent-router: api/router.md
    - pyagent-compress: api/compress.md
    - pyagent-trace: api/trace.md
    - pyagent-providers: api/providers.md
    - pyagent-context: api/context.md
    - pyagent-blueprint: api/blueprint.md
    - pyagent-studio: api/studio.md

  # ── Resources ────────────────────────────────────────────────────────────────
  - Resources:
    - Benchmarks: benchmarks.md
    - Contributing: contributing.md
