[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyagent-studio"
version = "0.3.0"
description = "Kubernetes Dashboard for Agent Systems — CLI + web control plane for multi-agent LLM blueprints"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "PyAgent Team", email = "team@pyagent.org"}]
keywords = ["agents", "studio", "LLM", "workbench", "dashboard", "fastapi", "litellm", "multi-agent observability", "agent control plane", "agent harness"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pyagent-blueprint>=0.1.0",
    "pyagent-trace>=0.1.0",
    "pyagent-providers>=0.1.0",
    "click>=8.1",
    "rich>=13.0",
    "litellm>=1.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://pyagent.org"
Repository = "https://github.com/pyagent-core/pyagent"
Documentation = "https://pyagent.org"
"Design Patterns" = "https://pyagent.org/packages/patterns/"
"Getting Started" = "https://pyagent.org/getting-started/"
"Cookbook" = "https://pyagent.org/cookbook/"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
pyagent = "pyagent_studio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyagent_studio"]
