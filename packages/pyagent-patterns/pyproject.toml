[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyagent-patterns"
version = "0.3.0"
description = "18 reusable multi-agent orchestration patterns for LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "PyAgent Team", email = "team@pyagent.org"}]
keywords = ["agents", "multi-agent", "LLM", "patterns", "orchestration", "multi-agent design patterns", "orchestrator-worker pattern", "multi-agent orchestration", "supervisor pattern"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://pyagent.org"
Repository = "https://github.com/pyagent-core/pyagent"
Documentation = "https://pyagent.org"
"Design Patterns" = "https://pyagent.org/packages/patterns/"
"Getting Started" = "https://pyagent.org/getting-started/"
"Cookbook" = "https://pyagent.org/cookbook/"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyagent_patterns"]
