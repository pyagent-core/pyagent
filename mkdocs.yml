site_name: PyAgent
site_description: "PyAgent: a production stack for multi-agent LLM systems — YAML blueprints, 18 orchestration patterns, three-tier memory, and OTel tracing"
site_url: https://pyagent.org
repo_url: https://github.com/pyagent-core/pyagent
repo_name: pyagent-core/pyagent

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.mark
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - packages/pyagent-patterns/src
            - packages/pyagent-router/src
            - packages/pyagent-compress/src
            - packages/pyagent-trace/src
            - packages/pyagent-providers/src
            - packages/pyagent-context/src
            - packages/pyagent-blueprint/src
            - packages/pyagent-studio/src
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2

nav:
  - Home: index.md
  - Getting Started: getting-started.md

  # ── Design Patterns & Concepts (SEO landing pages) ───────────────────────────
  - Design Patterns:
    - Orchestrator-Worker: patterns/orchestrator-worker.md
    - Plan-Act-Reflect-Repeat: patterns/plan-act-reflect.md
  - Architecture:
    - Multi-Agent Harness: architecture/multi-agent-harness.md
  - Concepts:
    - Agent Experience Optimization (AXO): concepts/agent-experience-optimization.md

  # ── Pillar 1: Blueprint ──────────────────────────────────────────────────────
  - Blueprint:
    - Guide: guides/blueprint.md
    - Spec Format: packages/blueprint/spec-format.md
    - Agents: packages/blueprint/agents.md
    - Workflows: packages/blueprint/workflows.md
    - Providers Config: packages/blueprint/providers.md
    - Context Config: packages/blueprint/context.md
    - Contracts & Observability: packages/blueprint/contracts.md
    - CLI: packages/blueprint/cli.md
    - Python API: packages/blueprint/compiler.md

  # ── Pillar 2: Execution ──────────────────────────────────────────────────────
  - Execution:
