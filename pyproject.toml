[project]
name = "pyagent-workspace"
version = "0.1.0"
description = "Monorepo for multi-agent orchestration primitives"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.uv.workspace]
members = [
    "packages/pyagent-patterns",
    "packages/pyagent-router",
    "packages/pyagent-compress",
    "packages/pyagent-trace",
    "packages/pyagent-all",
]

[tool.uv.sources]
pyagent-patterns = { workspace = true }
pyagent-compress = { workspace = true }
pyagent-router   = { workspace = true }
pyagent-trace    = { workspace = true }
pyagent-all      = { workspace = true }

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH", "RUF"]
ignore = ["E501", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages"]
addopts = "--import-mode=importlib"
