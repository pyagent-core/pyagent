[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyagent-blueprint-adapter-semantic-kernel"
version = "0.1.0"
description = "A pyagent-blueprint RuntimeAdapter targeting Microsoft Semantic Kernel"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pyagent-blueprint>=0.2.4",
    "semantic-kernel>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.entry-points."pyagent_blueprint.adapters"]
semantic_kernel = "pyagent_blueprint_adapter_semantic_kernel.adapter:SemanticKernelAdapter"

[tool.hatch.build.targets.wheel]
packages = ["src/pyagent_blueprint_adapter_semantic_kernel"]
