name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  PYTHONPATH: "${{ github.workspace }}/packages/pyagent-patterns/src:${{ github.workspace }}/packages/pyagent-compress/src:${{ github.workspace }}/packages/pyagent-router/src:${{ github.workspace }}/packages/pyagent-trace/src:${{ github.workspace }}/packages/pyagent-context/src:${{ github.workspace }}/packages/pyagent-providers/src:${{ github.workspace }}/packages/pyagent-blueprint/src:${{ github.workspace }}/packages/pyagent-studio/src"

jobs:

  # ── Stage 1: Lint ────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.1
      - run: ruff check packages/
      - run: ruff format --check packages/

  # ── Stage 2: Test ────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          pip install pytest pytest-asyncio
          pip install -e packages/pyagent-patterns
          pip install -e packages/pyagent-router
          pip install -e packages/pyagent-compress
          pip install -e packages/pyagent-trace
          pip install -e packages/pyagent-context
          pip install -e packages/pyagent-providers
          pip install -e "packages/pyagent-blueprint[dev]"
          pip install -e "packages/pyagent-studio[dev]"
          pip install -e packages/pyagent-blueprint-adapter-langgraph
          pip install -e packages/pyagent-blueprint-adapter-crewai
          pip install -e packages/pyagent-blueprint-adapter-openai-agents
          pip install -e packages/pyagent-blueprint-adapter-semantic-kernel
      - run: python -m pytest packages/ -v --tb=short

  # ── Stage 3a: Benchmark ──────────────────────────────────────────────────────
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-asyncio
      - run: python -m benchmarks.run --suite cost

  # ── Stage 3b: Docs check (every push + PR) ──────────────────────────────────
  docs-check:
    name: Docs — Build Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install mkdocs mkdocs-material mkdocstrings[python] mkdocs-redirects mkdocs-llmstxt
          pip install linkchecker pytest
          pip install -e packages/pyagent-patterns
          pip install -e packages/pyagent-router
          pip install -e packages/pyagent-compress
          pip install -e packages/pyagent-trace
          pip install -e packages/pyagent-context
          pip install -e packages/pyagent-providers
          pip install -e "packages/pyagent-blueprint[dev]"
          pip install -e "packages/pyagent-studio[dev]"
      # 0. Generated docs (benchmark tables, cookbook index) must be in sync
      #    with their data sources.
      - run: python scripts/gen_docs.py --check
      # 1. Strict build — broken links / bad config fail here.
      - run: DISABLE_MKDOCS_2_WARNING=true mkdocs build --strict
      # 2. Link integrity on the built site. The Material custom_dir template is
      #    copied to site/overrides/ as a build artifact; its links are
      #    template-relative (resolved against the real home page), so crawling
      #    it standalone yields false positives — ignore that path only.
      - run: linkchecker --no-warnings --ignore-url='.*/overrides/.*' site/
      # 3. Syntax-check every python code block in the docs.
      - run: python -m pytest tests/docs -q

  # ── Stage 4a: Docs deploy (main branch only) ─────────────────────────────────
  docs-deploy:
    name: Docs — Deploy
    runs-on: ubuntu-latest
    needs: docs-check
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install mkdocs mkdocs-material mkdocstrings[python] mkdocs-redirects mkdocs-llmstxt
          pip install -e packages/pyagent-patterns
          pip install -e packages/pyagent-router
          pip install -e packages/pyagent-compress
          pip install -e packages/pyagent-trace
          pip install -e packages/pyagent-context
          pip install -e packages/pyagent-providers
          pip install -e "packages/pyagent-blueprint[dev]"
          pip install -e "packages/pyagent-studio[dev]"
      - run: DISABLE_MKDOCS_2_WARNING=true mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - uses: actions/deploy-pages@v4
        id: deployment
