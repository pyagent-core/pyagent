[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyagent-blueprint-adapter-openai-agents"
version = "0.1.0"
description = "A pyagent-blueprint RuntimeAdapter targeting the OpenAI Agents SDK"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pyagent-blueprint>=0.2.4",
    "openai-agents>=0.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.entry-points."pyagent_blueprint.adapters"]
openai_agents = "pyagent_blueprint_adapter_openai_agents.adapter:OpenAIAgentsAdapter"

[tool.hatch.build.targets.wheel]
packages = ["src/pyagent_blueprint_adapter_openai_agents"]
