site_name: PyAgent
site_description: "PyAgent: a spec-driven architecture for orchestrating multi-agent systems — YAML blueprints, 18 orchestration patterns, three-tier memory, and OTel tracing"
site_url: https://pyagent.org
repo_url: https://github.com/pyagent-core/pyagent
repo_name: pyagent-core/pyagent

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/tokens.css
  - stylesheets/home.css
  - stylesheets/recipe-filter.css
  - stylesheets/bibliography.css

extra_javascript:
  - javascripts/guided-mode.js
  - javascripts/mermaid-reinit.js
  - javascripts/recipe-filter.js
  - javascripts/bibliography-filter.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.mark
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - redirects:
      redirect_maps:
        patterns/orchestrator-worker.md: packages/patterns/orchestration/orchestrator-workers.md
        patterns/plan-act-reflect.md: packages/patterns/advanced/react.md
        architecture/multi-agent-harness.md: guides/recovery.md
        concepts/agent-experience-optimization.md: guides/blueprint.md
        cookbook/code-review.md: cookbook/software-engineering/code-review.md
        cookbook/research.md: cookbook/research-analysis/research-assistant.md
        api/patterns.md: api/patterns/base.md
        cookbook/api-bibliography.md: api/bibliography.md
        cookbook/customer-support/index.md: cookbook/index.md
        cookbook/data-analytics/index.md: cookbook/index.md
        cookbook/devops-sre/index.md: cookbook/index.md
        cookbook/ecommerce-retail/index.md: cookbook/index.md
        cookbook/education/index.md: cookbook/index.md
        cookbook/finance-trading/index.md: cookbook/index.md
        cookbook/gaming/index.md: cookbook/index.md
        cookbook/government/index.md: cookbook/index.md
        cookbook/healthcare/index.md: cookbook/index.md
        cookbook/hr-recruiting/index.md: cookbook/index.md
        cookbook/legal-compliance/index.md: cookbook/index.md
        cookbook/marketing-content/index.md: cookbook/index.md
        cookbook/media-entertainment/index.md: cookbook/index.md
        cookbook/real-estate/index.md: cookbook/index.md
        cookbook/research-analysis/index.md: cookbook/index.md
        cookbook/sales-crm/index.md: cookbook/index.md
        cookbook/scientific/index.md: cookbook/index.md
        cookbook/security/index.md: cookbook/index.md
        cookbook/software-engineering/index.md: cookbook/index.md
        cookbook/travel-hospitality/index.md: cookbook/index.md
        cookbook/tags.md: cookbook/index.md
        architecture/execution.md: architecture/index.md
        architecture/context.md: architecture/index.md
        getting-started/featured-examples.md: cookbook/index.md
  - mkdocstrings:
      handlers:
        python:
          paths:
            - packages/pyagent-patterns/src
            - packages/pyagent-router/src
            - packages/pyagent-compress/src
            - packages/pyagent-trace/src
            - packages/pyagent-providers/src
            - packages/pyagent-context/src
            - packages/pyagent-blueprint/src
            - packages/pyagent-studio/src
          options:
            show_source: false
            show_root_heading: true
            heading_level: 2
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >-
        PyAgent is a spec-driven architecture for orchestrating multi-agent systems — 18 named design patterns
        (also published as structured JSON at /patterns.json), four independent architecture pillars
        (Blueprint, Execution & Routing, Context & Memory, Observability), every package's full capability
        surface as structured JSON at /capabilities.json, and a Cookbook of 37 complete, runnable
        multi-agent orchestration examples across all 21 domains.
      sections:
        Docs:
          - api/*.md
          - api/patterns/*.md
          - guides/hooks.md
          - guides/router.md
          - guides/providers.md
          - guides/compression.md
          - guides/context.md
          - packages/router.md
          - packages/providers.md
          - packages/compress.md
          - packages/context.md
        Blueprint (Spec-Driven):
          - architecture/blueprint.md
          - architecture/blueprint-specification.md
          - guides/blueprint.md
          - packages/blueprint/*.md
        Design Patterns:
          - packages/patterns/index.md
          - packages/patterns/*/*.md
          - guides/composition.md
          - guides/guardrails.md
          - guides/recovery.md
        Observability:
          - architecture/observability.md
          - guides/tracing.md
          - guides/studio.md
          - packages/trace.md
          - packages/studio/*.md
        Why PyAgent:
          - getting-started.md
          - getting-started/core-concepts.md
          - about.md
          - architecture/index.md
          - why-blueprint.md
          - compare/*.md
          - essays/*.md
          - concepts/*.md
          - architecture/decisions/*.md
          - capabilities.md
          - benchmarks.md
          - contributing.md
        Cookbook:
          - cookbook/index.md
          - cookbook/*/*.md

