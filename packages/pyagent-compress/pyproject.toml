[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyagent-compress"
version = "0.2.0"
description = "Inter-agent message compression and token budget management for multi-agent LLM systems"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["agents", "compression", "LLM", "tokens", "efficiency"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
authors = [
    {name = "PyAgent Contributors"},
]
dependencies = ["pyagent-patterns>=0.1.0"]

[project.urls]
Homepage      = "https://github.com/pyagent-core/pyagent"
Source        = "https://github.com/pyagent-core/pyagent/tree/main/packages/pyagent-compress"
Documentation = "https://pyagent-core.github.io/pyagent"
Issues        = "https://github.com/pyagent-core/pyagent/issues"
Changelog     = "https://github.com/pyagent-core/pyagent/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyagent_compress"]
